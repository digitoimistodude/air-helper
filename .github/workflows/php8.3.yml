name: PHP 8.3 compatibility

on: [push, pull_request]

jobs:
  build:
    name: Test for PHP 8.3 support
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --optimize-autoloader

      - name: Run PHPCompatibility
        run: vendor/bin/phpcs -p . --extensions=php --ignore=vendor,node_modules,plugin-update-checker --standard=PHPCompatibilityWP --runtime-set testVersion 8.3-
