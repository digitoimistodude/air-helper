name: PHP

on: [push, pull_request]

jobs:
  build:
    name: Test php
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --optimize-autoloader

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs -p . --extensions=php --ignore=vendor,node_modules,plugin-update-checker --standard=phpcs.xml

      - name: Test PHP for syntax errors
        run: find -L . -name '*.php' -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./plugin-update-checker/*" -print0 | xargs -0 -n 1 -P 4 php -l
